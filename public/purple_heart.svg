<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleHeartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    <linearGradient id="purpleHeartGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Glow -->
  <path
    d="M 50,88 C 25,68 8,50 8,30 C 8,16 18,6 32,6 C 40,6 46,10 50,16 C 54,10 60,6 68,6 C 82,6 92,16 92,30 C 92,50 75,68 50,88 Z"
    fill="url(#purpleHeartGlow)"
    filter="url(#softGlow)"
    opacity="0.6"
  />
  <!-- Main Heart -->
  <path
    d="M 50,84 C 27,65 12,48 12,30 C 12,18 21,9 33,9 C 40.5,9 46.5,13 50,18.5 C 53.5,13 59.5,9 67,9 C 79,9 88,18 88,30 C 88,48 73,65 50,84 Z"
    fill="url(#purpleHeartGrad)"
  />
  <!-- Specular Highlight for 3D Gloss -->
  <path
    d="M 32,14 C 24,14 18,20 18,28 C 18,34 22,42 30,50 C 27,42 26,34 27,27 C 28,21 32,17 38,15 C 36,14.3 34,14 32,14 Z"
    fill="#ffffff"
    opacity="0.35"
  />
  <ellipse cx="65" cy="22" rx="6" ry="3" transform="rotate(-25 65 22)" fill="#ffffff" opacity="0.25" />
</svg>
